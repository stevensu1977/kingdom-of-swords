[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="LICENSE,THIRD_PARTY_NOTICES.txt,assets/characters/*.json,assets/template/*.json,assets/external.json"
exclude_filter="tools/*,test/*,docs/*,.github/*,assets/qa/*,assets/manifest.json,scenes/build*,build/*,screenshots/*,README*,CONTRIBUTING.md,AGENTS.md"
export_path="build/windows/game.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true

[preset.1]
name="macOS"
platform="macOS"
runnable=false
export_filter="all_resources"
include_filter="LICENSE,THIRD_PARTY_NOTICES.txt,assets/characters/*.json,assets/template/*.json,assets/external.json"
exclude_filter="tools/*,test/*,docs/*,.github/*,assets/qa/*,assets/manifest.json,scenes/build*,build/*,screenshots/*,README*,CONTRIBUTING.md,AGENTS.md"
export_path="build/macos/game.zip"

[preset.1.options]
binary_format/architecture="universal"
application/bundle_identifier="io.github.stevensu1977.kingdomofswords"
application/short_version="1.0"
application/version="1.0"
codesign/codesign=0
codesign/identity=""
notarization/notarization=0
codesign/entitlements/allow_jit_code_execution=true
codesign/entitlements/allow_unsigned_executable_memory=true
codesign/entitlements/allow_dyld_environment_variables=true
codesign/entitlements/disable_library_validation=true

[preset.2]
name="Linux"
platform="Linux"
runnable=false
export_filter="all_resources"
include_filter="LICENSE,THIRD_PARTY_NOTICES.txt,assets/characters/*.json,assets/template/*.json,assets/external.json"
exclude_filter="tools/*,test/*,docs/*,.github/*,assets/qa/*,assets/manifest.json,scenes/build*,build/*,screenshots/*,README*,CONTRIBUTING.md,AGENTS.md"
export_path="build/linux/game.x86_64"

[preset.2.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
